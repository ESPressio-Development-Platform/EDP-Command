    symlink://../../../../EDP-Clock
    symlink://../../../../EDP-System
    symlink://../../../../EDP-Primitives
    symlink://../../../../EDP-Platform
    symlink://../../../../EDP-Platform-FreeRTOS
    symlink://../../../../EDP-Threading
