[env:esp32dev]
; Pin the same pioarduino revision already validated by EDP-Threading.
; The stable 55.3.311 package path installs SCons 4.11.1 in a way that breaks
; framework=espidf with ModuleNotFoundError: SCons.Tool.FortranCommon.
platform = https://github.com/pioarduino/platform-espressif32.git#d41d8383706dc146fd91a0e1d3c59a915a4d493e
board = esp32dev
framework = espidf
lib_compat_mode = off
build_flags = -std=gnu++20
build_unflags = -std=gnu++11 -std=gnu++14 -std=gnu++17
lib_deps =
    ../../..
    ../../../../EDP-Memory
    ../../../../EDP-Clock
    ../../../../EDP-System
    ../../../../EDP-Platform
