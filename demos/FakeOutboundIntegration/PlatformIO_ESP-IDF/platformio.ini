[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = espidf
lib_compat_mode = off
build_flags = -std=gnu++20
build_unflags = -std=gnu++11 -std=gnu++14 -std=gnu++17
lib_deps =
    ../../..
    ../../../../EDP-Memory
    ../../../../EDP-Clock
    ../../../../EDP-System
    ../../../../EDP-Platform
